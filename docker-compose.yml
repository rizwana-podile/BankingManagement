version: '3.8'

services:
  banking-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura-banking-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
    restart: unless-stopped

  banking-frontend:
    image: node:20-alpine
    container_name: aura-banking-frontend
    working_dir: /app/frontend
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - banking-backend